    function runMatch(){const role=(roleInput.value||'this role').trim();const r=role.toLowerCase();let focus='';if(currentLang==='he'){if(r.includes('qa')||r.includes('test'))focus='רקע ה-QA כולל בדיקות פונקציונליות, רגרסיה ו-API, עבודה עם Postman, JIRA/TestRail, Agile ואוטומציה ב-Python/Selenium.';else if(r.includes('seo'))focus='ההתאמה מבוססת על SEO, דפי נחיתה, תוכן, אנליטיקה וניסיון בשווקים בינלאומיים.';else if(r.includes('market')||r.includes('growth')||r.includes('performance'))focus='ההתאמה החזקה היא שילוב של SEO, מדיה ממומנת, דפי נחיתה, משפכי לידים וניסיון בקמפיינים בינלאומיים.';else if(r.includes('sales')||r.includes('retention')||r.includes('customer'))focus='הניסיון כולל שיחות קרות וחמות, ניהול צינור לקוחות, מכירה ייעוצית, CRM ותקשורת ממוקדת שימור.';else if(r.includes('operation'))focus='ההתאמה מבוססת על ניסיון תפעולי, בניית תהליכים, ניהול מלאי/Workflow, CRM ואוטומציה של משימות חוזרות.';else focus='ההתאמה המוצרית מבוססת על שילוב של CRM, תהליכים, צמיחה דיגיטלית, אוטומציה, אנליטיקה ועבודה עם צוותים עסקיים וטכניים.';matchOutput.innerHTML='<b>התאמה לתפקיד '+h(role)+':</b><br><br>'+focus+' הוא מתאים לצוותים שצריכים אדם פרקטי שמבין מטרות עסקיות ומבצע באופן עצמאי.';}else if(currentLang==='ru'){if(r.includes('qa')||r.includes('test'))focus='QA-бэкграунд включает functional, regression и API testing, Postman, JIRA/TestRail, Agile workflows и Python/Selenium automation.';else if(r.includes('seo'))focus='Сильное соответствие основано на SEO, landing pages, content logic, analytics и опыте на международных рынках.';else if(r.includes('market')||r.includes('growth')||r.includes('performance'))focus='Сильная сторона — комбинация SEO, paid media, landing pages, lead funnels и международного campaign experience.';else if(r.includes('sales')||r.includes('retention')||r.includes('customer'))focus='Опыт включает cold/warm calls, pipeline ownership, consultative selling, CRM workflows и retention-focused communication.';else if(r.includes('operation'))focus='Соответствие основано на operations background, process design, inventory/workflow logic, CRM и automation of repetitive tasks.';else focus='Product-fit строится на сочетании CRM/process design, digital growth, automation, analytics и коммуникации с business/technical stakeholders.';matchOutput.innerHTML='<b>Match для роли '+h(role)+':</b><br><br>'+focus+' Он особенно релевантен для команд, которым нужен практичный исполнитель с пониманием business goals и самостоятельной реализацией.';}else{if(r.includes('qa')||r.includes('test'))focus='His QA background includes functional, regression and API testing, Postman, JIRA/TestRail, Agile workflows and Python/Selenium automation.';else if(r.includes('seo'))focus='His strongest match comes from SEO, landing pages, content logic, analytics and international market experience.';else if(r.includes('market')||r.includes('growth')||r.includes('performance'))focus='His strongest match is the combination of SEO, paid media, landing pages, lead funnels and international campaign experience.';else if(r.includes('sales')||r.includes('retention')||r.includes('customer'))focus='His sales and client-facing experience includes cold and warm calls, pipeline ownership, consultative selling, CRM workflows and retention-focused communication.';else if(r.includes('operation'))focus='His fit is based on operations background, process design, inventory/workflow logic, CRM and automation of repetitive tasks.';else focus='His product fit comes from combining CRM/process design, digital growth, automation, analytics and direct collaboration with business and technical stakeholders.';matchOutput.innerHTML='<b>Match for '+h(role)+':</b><br><br>'+focus+' He is especially relevant for teams that need a practical operator who understands business goals and can execute hands-on.';}matchOutput.classList.add('show')}
    function switchRadar(i){radarIndex=i;render()}
    function drawRadar(){const canvas=document.getElementById('radarCanvas');if(!canvas)return;const ctx=canvas.getContext('2d');const d=radarData[radarIndex];const w=canvas.width,hgt=canvas.height,cx=w/2,cy=hgt/2+4,R=145;ctx.clearRect(0,0,w,hgt);ctx.font='12px Inter, sans-serif';ctx.lineWidth=1;for(let level=1;level<=5;level++){ctx.beginPath();for(let i=0;i<d.axes.length;i++){const a=-Math.PI/2+i*2*Math.PI/d.axes.length;const r=R*level/5;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.strokeStyle='#e6e1d8';ctx.stroke()}d.axes.forEach((label,i)=>{const a=-Math.PI/2+i*2*Math.PI/d.axes.length;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*R,cy+Math.sin(a)*R);ctx.strokeStyle='#eeeae2';ctx.stroke();const lx=cx+Math.cos(a)*(R+38),ly=cy+Math.sin(a)*(R+30);ctx.fillStyle='#5c5a55';ctx.textAlign=lx<cx-10?'right':lx>cx+10?'left':'center';ctx.textBaseline='middle';ctx.fillText(label,lx,ly)});ctx.beginPath();d.values.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/d.axes.length;const r=R*v/100;const x=cx+Math.cos(a)*r,y=cy+Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=d.color+'33';ctx.strokeStyle=d.color;ctx.lineWidth=2;ctx.fill();ctx.stroke();d.values.forEach((v,i)=>{const a=-Math.PI/2+i*2*Math.PI/d.axes.length;const r=R*v/100;ctx.beginPath();ctx.arc(cx+Math.cos(a)*r,cy+Math.sin(a)*r,4,0,Math.PI*2);ctx.fillStyle=d.color;ctx.fill()})}
    const tip=document.getElementById('rTip'), tipLabel=document.getElementById('rTipLabel'), tipText=document.getElementById('rTipText');document.addEventListener('mousemove',e=>{const canvas=document.getElementById('radarCanvas');if(!canvas)return;const rect=canvas.getBoundingClientRect();const x=e.clientX-rect.left,y=e.clientY-rect.top;if(x<0||y<0||x>rect.width||y>rect.height){tip.classList.remove('on');return}const scale=canvas.width/rect.width,cx=canvas.width/2,cy=canvas.height/2+4,R=145;let found=null;radarData[radarIndex].axes.forEach((label,i)=>{const a=-Math.PI/2+i*2*Math.PI/radarData[radarIndex].axes.length;const lx=cx+Math.cos(a)*(R+38),ly=cy+Math.sin(a)*(R+30);const dx=x*scale-lx,dy=y*scale-ly;if(Math.sqrt(dx*dx+dy*dy)<42)found=label});if(found){tipLabel.textContent=found;tipText.textContent=radarData[radarIndex].tips[found];tip.style.left=(x+18)+'px';tip.style.top=(y+18)+'px';tip.classList.add('on')}else tip.classList.remove('on')});
    const revealObserver=new IntersectionObserver(entries=>{entries.forEach(entry=>{if(entry.isIntersecting)entry.target.classList.add('visible')})},{threshold:.08});
    function observeReveals(){document.querySelectorAll('.reveal').forEach(el=>revealObserver.observe(el))}
    window.addEventListener('resize',drawRadar);render();observeReveals();
  </script>
